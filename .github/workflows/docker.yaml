
name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  build:
    name: Copy Images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version

      - name: Prepare temporary space
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/skopeo-tmp
          echo "TMPDIR=/mnt/skopeo-tmp" >> "$GITHUB_ENV"
          df -hT / /mnt

      - name: Login to Aliyun Registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ALIYUN_REGISTRY_PASSWORD" |
            skopeo login \
              --username "$ALIYUN_REGISTRY_USER" \
              --password-stdin \
              "$ALIYUN_REGISTRY"

      - name: Copy Images
        shell: bash
        run: |
          set -euo pipefail

          declare -A seen_namespace=()
          declare -A duplicate_images=()

          # 解析 images.txt 的单行：
          # image:tag
          # --platform=linux/amd64 image:tag
          # --platform linux/arm64 image:tag
          parse_line() {
            local -a args
            read -r -a args <<< "$1"

            platform=""
            image=""

            case "${#args[@]}" in
              1)
                image="${args[0]}"
                ;;
              2)
                if [[ "${args[0]}" != --platform=* ]]; then
                  echo "Invalid image entry: $1" >&2
                  return 1
                fi
                platform="${args[0]#--platform=}"
                image="${args[1]}"
                ;;
              3)
                if [[ "${args[0]}" != "--platform" ]]; then
                  echo "Invalid image entry: $1" >&2
                  return 1
                fi
                platform="${args[1]}"
                image="${args[2]}"
                ;;
              *)
                echo "Invalid image entry: $1" >&2
                return 1
                ;;
            esac
          }

          # 第一遍：检测不同命名空间中的镜像重名
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%%#*}"

            [[ -z "${line//[[:space:]]/}" ]] && continue

            parse_line "$line"

            repo="${image%%@*}"
            name_tag="${repo##*/}"
            name="${name_tag%%:*}"

            namespace=""
            if [[ "$repo" == */* ]]; then
              namespace="${repo%/*}"
              namespace="${namespace##*/}"
            fi

            if [[ -n "${seen_namespace[$name]+set}" ]] &&
               [[ "${seen_namespace[$name]}" != "$namespace" ]]; then
              duplicate_images["$name"]=1
            fi

            seen_namespace["$name"]="$namespace"
          done < images.txt

          # 第二遍：逐个复制镜像
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%%#*}"

            [[ -z "${line//[[:space:]]/}" ]] && continue

            parse_line "$line"

            repo="${image%%@*}"
            name_tag="${repo##*/}"
            name="${name_tag%%:*}"

            # 未指定 tag 时使用 latest
            if [[ "$name_tag" != *:* ]]; then
              name_tag="${name_tag}:latest"
            fi

            namespace=""
            if [[ "$repo" == */* ]]; then
              namespace="${repo%/*}"
              namespace="${namespace##*/}"
            fi

            # 只有重名时才添加源命名空间前缀
            namespace_prefix=""
            if [[ -n "${duplicate_images[$name]+set}" ]] &&
               [[ -n "$namespace" ]]; then
              namespace_prefix="${namespace}_"
            fi

            # 指定目标平台
            platform_prefix=""
            platform_opts=()

            if [[ -n "$platform" ]]; then
              IFS='/' read -r os arch variant extra <<< "$platform"

              if [[ "$os" != "linux" || -z "$arch" || -n "$extra" ]]; then
                echo "Unsupported platform: $platform" >&2
                exit 1
              fi

              platform_opts=(
                --override-os "$os"
                --override-arch "$arch"
              )

              if [[ -n "$variant" ]]; then
                platform_opts+=(--override-variant "$variant")
              fi

              platform_prefix="${platform//\//_}_"
            fi

            # 规范化 Docker Hub 镜像地址
            source_image="$image"
            first_part="${source_image%%/*}"

            if [[ "$source_image" != */* ]]; then
              source_image="docker.io/library/$source_image"
            elif [[ "$first_part" != *.* &&
                    "$first_part" != *:* &&
                    "$first_part" != "localhost" ]]; then
              source_image="docker.io/$source_image"
            fi

            if [[ "$source_image" == docker.io/* ]]; then
              suffix="${source_image#docker.io/}"
              if [[ "$suffix" != */* ]]; then
                source_image="docker.io/library/$suffix"
              fi
            fi

            target_image="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${platform_prefix}${namespace_prefix}${name_tag}"

            echo "========================================"
            echo "Source: $source_image"
            echo "Target: $target_image"
            echo "Platform: ${platform:-default}"
            echo "========================================"

            skopeo "${platform_opts[@]}" copy \
              "docker://$source_image" \
              "docker://$target_image"

            echo "Image copy successful"
            df -h / /mnt

          done < images.txt

      - name: Check final disk usage
        if: always()
        run: |
          df -hT / /mnt
          du -sh /mnt/skopeo-tmp 2>/dev/null || true
